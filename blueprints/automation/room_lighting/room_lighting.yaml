blueprint:
  name: Room lighting (layers, buttons, motion)
  description: >
    Controls a room's Direct, Indirect (ambient) and Task lighting from one or
    more Hue buttons and an optional motion sensor (with optional lux sensor).


    **Main buttons**

    - Short press: step to the next light mode: Indirect → Indirect+Direct →
    Indirect+Direct+Task → Off, then Indirect again. Layers the room doesn't
    have are skipped.

    - Long press: room off.


    **Motion** turns on the first light mode (Indirect) when it is dark enough,
    and switches the room off after a period without motion. Using a button
    sets the manual override helper, which stops motion from switching the room
    off until the room is turned off.


    Brightness and colour temperature are left to Adaptive Lighting.
  domain: automation
  homeassistant:
    min_version: 2024.8.0
  input:
    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      input:
        direct_lights:
          name: Direct lights
          description: Downlights, spots, ceiling lights.
          default: []
          selector:
            entity:
              filter:
                - domain: light
              multiple: true
        indirect_lights:
          name: Indirect lights
          description: Uplights, strips and other ambient lighting.
          default: []
          selector:
            entity:
              filter:
                - domain: light
              multiple: true
        task_lights:
          name: Task lights
          description: Reading, desk and other focused lighting.
          default: []
          selector:
            entity:
              filter:
                - domain: light
              multiple: true
    buttons_section:
      name: Buttons
      icon: mdi:gesture-tap-button
      input:
        buttons:
          name: Main buttons
          description: >
            Hue button event entities. A short press steps through the light
            modes; a long press switches the room off.
          default: []
          selector:
            entity:
              filter:
                - domain: event
              multiple: true
        short_press_types:
          name: Short press event types
          description: Values of the event entity's event_type attribute.
          default:
            - short_release
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - short_release
                - initial_press
                - single
                - press
        long_press_types:
          name: Long press event types
          description: >
            Event types that switch the room off. Switching off is repeatable,
            so listing both long_press and repeat is safe: whichever your
            button sends first while held does the job. Check the event entity's
            event_types attribute to see what it supports.
          default:
            - long_press
            - repeat
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - long_press
                - repeat
                - hold
    motion_section:
      name: Motion (optional)
      icon: mdi:motion-sensor
      collapsed: true
      input:
        motion_sensor:
          name: Motion sensor(s) (optional)
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class:
                    - motion
                    - occupancy
                    - presence
              multiple: true
        lux_sensor:
          name: Lux sensor (optional)
          description: Without a lux sensor, motion always switches lights on.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance
              multiple: false
        lux_threshold:
          name: Lux threshold
          description: Motion only switches lights on below this illuminance.
          default: 30
          selector:
            number:
              min: 0
              max: 1000
              unit_of_measurement: lx
        no_motion_minutes:
          name: Switch off after no motion
          description: >
            Motion switches the room off after this long without motion, unless
            you used a button (see the manual override helper below).
          default: 5
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: min
        override_helper:
          name: Manual override helper (needed with a motion sensor)
          description: >
            One input_boolean per room. A button press switches it on, so
            motion won't switch the room off while you are in control. It clears
            when the room goes off. Leave empty in rooms without a motion
            sensor; without it motion would also switch off lights you turned
            on with a button.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean
              multiple: false
    integrations_section:
      name: Adaptive Lighting & Night Mode
      icon: mdi:link-variant
      collapsed: true
      input:
        adaptive_lighting_switch:
          name: Adaptive Lighting switch (optional)
          description: Main Adaptive Lighting switch for this room; its manual control flags are reset when the room switches off.
          default: []
          selector:
            entity:
              filter:
                - domain: switch
                  integration: adaptive_lighting
              multiple: false
        manual_light_on_helper:
          name: Manual light-on timestamp (optional)
          description: >
            Date-and-time input_datetime helper shared with Night Mode.
            Records when a short press turns an off room on; turning off and
            motion do not count. Enable both date and time on the helper.
          default: []
          selector:
            entity:
              filter:
                - domain: input_datetime
              multiple: false

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  t_direct: !input direct_lights
  t_indirect: !input indirect_lights
  t_task: !input task_lights

trigger:
  - platform: state
    id: button
    entity_id: !input buttons
    not_from: [unavailable]
    not_to: [unavailable, unknown]
  - platform: state
    id: motion_on
    entity_id: !input motion_sensor
    from: "off"
    to: "on"
  - platform: state
    id: motion_off
    entity_id: !input motion_sensor
    to: "off"
    for:
      minutes: !input no_motion_minutes
  - platform: template
    id: room_off
    value_template: >
      {% set l = ([t_direct] if t_direct is string else t_direct)
        + ([t_indirect] if t_indirect is string else t_indirect)
        + ([t_task] if t_task is string else t_task) %}
      {{ l | count > 0 and l | select('is_state', 'on') | list | count == 0 }}

variables:
  in_direct: !input direct_lights
  in_indirect: !input indirect_lights
  in_task: !input task_lights
  in_motion: !input motion_sensor
  in_lux: !input lux_sensor
  in_override: !input override_helper
  in_al: !input adaptive_lighting_switch
  in_manual_light_on: !input manual_light_on_helper
  short_types: !input short_press_types
  long_types: !input long_press_types
  lux_threshold: !input lux_threshold

  direct: "{{ [in_direct] if in_direct is string else in_direct | list }}"
  indirect: "{{ [in_indirect] if in_indirect is string else in_indirect | list }}"
  task: "{{ [in_task] if in_task is string else in_task | list }}"
  motion_entities: "{{ [in_motion] if in_motion is string else in_motion | list }}"
  lux_entity: "{{ in_lux if in_lux is string else (in_lux | first if in_lux | count > 0 else '') }}"
  override_entity: "{{ in_override if in_override is string else (in_override | first if in_override | count > 0 else '') }}"
  al_entity: "{{ in_al if in_al is string else (in_al | first if in_al | count > 0 else '') }}"
  manual_light_on_entity: "{{ in_manual_light_on if in_manual_light_on is string else '' }}"

  layer_lights:
    direct: "{{ direct }}"
    indirect: "{{ indirect }}"
    task: "{{ task }}"
  all_lights: "{{ (direct + indirect + task) | unique | list }}"

  available_layers: >
    {% set ns = namespace(l=[]) %}
    {% for layer in ['direct', 'indirect', 'task'] %}
      {% if layer_lights[layer] | count > 0 %}{% set ns.l = ns.l + [layer] %}{% endif %}
    {% endfor %}
    {{ ns.l }}
  # Light modes in cycle order (each one adds a layer); modes collapse when a
  # room lacks a layer (e.g. no Indirect lights). Off comes after the last mode.
  modes: >
    {% set base = [['indirect'], ['indirect', 'direct'], ['indirect', 'direct', 'task']] %}
    {% set ns = namespace(out=[]) %}
    {% for s in base %}
      {% set f = s | select('in', available_layers) | sort | list %}
      {% if f | count > 0 and f not in ns.out %}
        {% set ns.out = ns.out + [f] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}
  # Motion switches on the first light mode.
  motion_lights: >
    {% set ns = namespace(l=[]) %}
    {% if modes | count > 0 %}
      {% for layer in modes[0] %}
        {% set ns.l = ns.l + layer_lights[layer] %}
      {% endfor %}
    {% endif %}
    {{ ns.l | unique | list }}

  event_type: >
    {{ (trigger.to_state.attributes.event_type | default(''))
       if trigger.to_state is defined and trigger.to_state else '' }}
  is_short: "{{ event_type in short_types }}"
  is_long: "{{ event_type in long_types }}"

action:
  # Everything that depends on the lights' current state is worked out here,
  # when the run actually starts. The top-level variables above are rendered at
  # trigger time, before a queued run (for example a quick second button press)
  # has waited for the previous run to finish, so they would still see the old
  # light states.
  - variables:
      on_lights: "{{ all_lights | select('is_state', 'on') | list }}"
      room_on: "{{ on_lights | count > 0 }}"
      layers_on: >
        {% set ns = namespace(l=[]) %}
        {% for layer in available_layers %}
          {% if layer_lights[layer] | select('is_state', 'on') | list | count > 0 %}
            {% set ns.l = ns.l + [layer] %}
          {% endif %}
        {% endfor %}
        {{ ns.l | sort }}
      # Layers of the next mode; empty means the next step is Off. A room that
      # is on in a combination that is not one of the modes goes to Off.
      next_layers: >
        {% set ns = namespace(i=-1, found=false, l=[]) %}
        {% if modes | count > 0 %}
          {% if not room_on %}
            {% set ns.l = modes[0] %}
          {% else %}
            {% for s in modes %}
              {% if s == layers_on %}{% set ns.i = loop.index0 %}{% set ns.found = true %}{% endif %}
            {% endfor %}
            {% if ns.found and ns.i + 1 < modes | count %}
              {% set ns.l = modes[ns.i + 1] %}
            {% endif %}
          {% endif %}
        {% endif %}
        {{ ns.l }}
      next_lights: >
        {% set ns = namespace(l=[]) %}
        {% for layer in next_layers %}
          {% set ns.l = ns.l + layer_lights[layer] %}
        {% endfor %}
        {{ ns.l | unique | list }}
      lights_to_switch_on: "{{ next_lights | reject('is_state', 'on') | list }}"
      # A short press that turns an entirely off room on (used for Night Mode wake detection).
      manual_light_on: >
        {{ not room_on and next_lights | count > 0
           and trigger.id == 'button' and is_short
           and trigger.from_state is defined and trigger.from_state is not none
           and trigger.to_state is defined and trigger.to_state is not none
           and trigger.from_state.state not in ['unknown', 'unavailable']
           and trigger.to_state.state not in ['unknown', 'unavailable']
           and trigger.from_state.state != trigger.to_state.state }}
      lux_ok: >
        {{ lux_entity == '' or not is_number(states(lux_entity))
           or states(lux_entity) | float < lux_threshold | float }}
      override_on: "{{ override_entity != '' and is_state(override_entity, 'on') }}"
      no_motion: "{{ motion_entities | select('is_state', 'on') | list | count == 0 }}"
  - choose:
      # ---------------- Main buttons ----------------
      - alias: Short press - next light mode (or off after the last)
        conditions:
          - "{{ trigger.id == 'button' and is_short }}"
        sequence:
          - choose:
              - conditions: "{{ next_lights | count > 0 }}"
                sequence:
                  - if: "{{ lights_to_switch_on | count > 0 }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ lights_to_switch_on }}"
                  # Let the light states settle so a quick next press (queued) sees them.
                  - wait_template: "{{ next_lights | select('is_state', 'on') | list | count == next_lights | count }}"
                    timeout: 3
                    continue_on_timeout: true
                  - if: "{{ override_entity != '' }}"
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: "{{ override_entity }}"
            default:
              - if: "{{ room_on }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ on_lights }}"
                  - wait_template: "{{ on_lights | select('is_state', 'on') | list | count == 0 }}"
                    timeout: 3
                    continue_on_timeout: true

      - alias: Long press - room off
        conditions:
          - "{{ trigger.id == 'button' and is_long and room_on }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ on_lights }}"

      # ---------------- Motion ----------------
      - alias: Motion - first light mode when dark
        conditions:
          - "{{ trigger.id == 'motion_on' }}"
          - "{{ not room_on and not override_on and lux_ok and motion_lights | count > 0 }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ motion_lights }}"

      - alias: No motion - room off unless overridden
        conditions:
          - "{{ trigger.id == 'motion_off' }}"
          - "{{ room_on and not override_on and no_motion }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ on_lights }}"

      # ---------------- Room switched off (from any source) ----------------
      - alias: Room off - clear override and Adaptive Lighting manual control
        conditions:
          - "{{ trigger.id == 'room_off' }}"
        sequence:
          - if: "{{ override_on }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ override_entity }}"
          - if: "{{ al_entity != '' }}"
            then:
              - action: adaptive_lighting.set_manual_control
                continue_on_error: true
                data:
                  entity_id: "{{ al_entity }}"
                  manual_control: false
  - if: "{{ manual_light_on and manual_light_on_entity != '' }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ manual_light_on_entity }}"
        data:
          timestamp: "{{ now().timestamp() }}"
