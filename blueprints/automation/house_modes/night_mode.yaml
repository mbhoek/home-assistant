blueprint:
  name: Night Mode
  description: >
    Uses a helper as the house's Night Mode state. An in-bed sensor turns the
    mode on. When the sensor goes off, Night Mode ends immediately if a
    room-lighting button turned an off room on since you last got into bed.
    Otherwise a wake window starts: a button press during it ends Night Mode,
    and so does the window running out. Getting back into bed during the
    window cancels it. A shared date-and-time helper records the light press.
    Turning the Night Mode helper off manually also ends Night Mode.


    When Night Mode turns on, the selected Adaptive Lighting sleep-mode
    switches are enabled and the selected lights are turned off. When it turns
    off, the sleep-mode switches are disabled.
  domain: automation
  homeassistant:
    min_version: 2024.8.0
  input:
    state_section:
      name: House state
      icon: mdi:home-switch
      input:
        night_mode_helper:
          name: Night Mode helper
          description: input_boolean that represents the current Night Mode state.
          selector:
            entity:
              filter:
                - domain: input_boolean
              multiple: false
        in_bed_sensor:
          name: In-bed sensor
          description: Turns Night Mode on when changing to on; off permits exit after a recent manual light-on.
          selector:
            entity:
              filter:
                - domain: binary_sensor
              multiple: false
    wake_section:
      name: Wake conditions
      icon: mdi:weather-sunset-up
      input:
        manual_light_on_helper:
          name: Manual light-on timestamp (optional)
          description: >
            Date-and-time input_datetime helper shared with the room-lighting
            automations. It must have both date and time enabled.
          default: []
          selector:
            entity:
              filter:
                - domain: input_datetime
              multiple: false
        wake_window:
          name: Wake window
          description: >
            How long the bed sensor must report off, with Night Mode on, before
            Night Mode ends without a light press. Getting back into bed during
            the window cancels it.
          default: 10
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
    buttons_section:
      name: Legacy exit buttons (unused)
      icon: mdi:gesture-tap-button
      input:
        exit_buttons:
          name: Exit buttons (unused)
          description: Retained for existing configurations; button presses no longer exit Night Mode directly.
          default: []
          selector:
            entity:
              filter:
                - domain: event
              multiple: true
        exit_press_types:
          name: Exit press event types (unused)
          description: Retained for existing configurations; use the shared manual light-on timestamp instead.
          default:
            - short_release
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - short_release
                - initial_press
                - single
                - press
    lighting_section:
      name: Lighting
      icon: mdi:lightbulb-group
      input:
        adaptive_lighting_sleep_switches:
          name: Adaptive Lighting sleep-mode switches
          description: Select each room's Adaptive Lighting sleep-mode switch.
          default: []
          selector:
            entity:
              filter:
                - domain: switch
                  integration: adaptive_lighting
              multiple: true
        lights_to_turn_off:
          name: Lights to turn off
          description: Select the household lights to switch off on Night Mode entry.
          default: []
          selector:
            entity:
              filter:
                - domain: light
              multiple: true

mode: queued

# Template triggers cannot see the regular `variables:` block below.
trigger_variables:
  night_mode_entity: !input night_mode_helper
  bed_entity: !input in_bed_sensor

trigger:
  - platform: state
    id: in_bed
    entity_id: !input in_bed_sensor
    from: "off"
    to: "on"
  - platform: state
    id: out_of_bed
    entity_id: !input in_bed_sensor
    to: "off"
  # Wake window: bed sensor off while Night Mode is on, continuously. Resets
  # when the sensor goes back on (or Night Mode ends); also starts when Night
  # Mode is turned on while the sensor already reads off.
  - platform: template
    id: wake_timeout
    value_template: "{{ is_state(bed_entity, 'off') and is_state(night_mode_entity, 'on') }}"
    for:
      minutes: !input wake_window
  - platform: state
    id: manual_light_on
    entity_id: !input manual_light_on_helper
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]
  - platform: state
    id: night_mode_on
    entity_id: !input night_mode_helper
    to: "on"
  - platform: state
    id: night_mode_off
    entity_id: !input night_mode_helper
    to: "off"

variables:
  night_mode_entity: !input night_mode_helper
  bed_entity: !input in_bed_sensor
  in_manual_light_on: !input manual_light_on_helper
  wake_window: !input wake_window
  manual_light_on_entity: "{{ in_manual_light_on if in_manual_light_on is string else '' }}"
  sleep_switches: !input adaptive_lighting_sleep_switches
  lights_to_turn_off: !input lights_to_turn_off

action:
  - choose:
      - alias: In bed - enter Night Mode
        conditions:
          - "{{ trigger.id == 'in_bed' }}"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input night_mode_helper

      - alias: Out of bed and light-on button pressed - leave Night Mode
        conditions:
          - >
            {{ trigger.id in ['out_of_bed', 'manual_light_on']
               and is_state(night_mode_entity, 'on')
               and is_state(bed_entity, 'off')
               and manual_light_on_entity != '' }}
          - >
            {% set stamp = as_timestamp(states(manual_light_on_entity), 0) %}
            {% set mode_since = as_timestamp(states[night_mode_entity].last_changed) %}
            {% if trigger.id == 'out_of_bed' %}
              {# Sensor just went off: any press since getting into bed counts, however long ago. #}
              {% set fs = trigger.from_state %}
              {% set bed_since = as_timestamp(fs.last_changed) if fs is not none and fs.state == 'on' else 0 %}
              {{ stamp > 0 and stamp >= mode_since and stamp >= bed_since }}
            {% else %}
              {# Press made during the wake window (sensor off, Night Mode on). #}
              {{ stamp > 0 and stamp >= mode_since }}
            {% endif %}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input night_mode_helper

      - alias: Out of bed for the whole wake window - leave Night Mode anyway
        conditions:
          - "{{ trigger.id == 'wake_timeout' }}"
          - "{{ is_state(night_mode_entity, 'on') and is_state(bed_entity, 'off') }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input night_mode_helper

      - alias: Night Mode enabled - set sleep lighting and turn off lights
        conditions:
          - "{{ trigger.id == 'night_mode_on' }}"
        sequence:
          - if: "{{ sleep_switches | count > 0 }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: "{{ sleep_switches }}"
          - if: "{{ lights_to_turn_off | count > 0 }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: "{{ lights_to_turn_off }}"

      - alias: Night Mode disabled - leave sleep lighting
        conditions:
          - "{{ trigger.id == 'night_mode_off' }}"
        sequence:
          - if: "{{ sleep_switches | count > 0 }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: "{{ sleep_switches }}"
